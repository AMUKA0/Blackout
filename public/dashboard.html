<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackout HQ</title>
<style>
  :root { --navy: #0b1f5c; --link: #8fb0e8; --pink: #f4b6c2; --cut: #c4163c; --paper: #f5f2ec; --water: #cfdcf3; --land: #ffffff; --save: #2f8f5b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--navy); font-family: system-ui, sans-serif; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 1.8rem; }
  #tick { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .layout { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); gap: 24px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; border-radius: 12px; display: block; }
  .land { fill: var(--land); } .water { fill: var(--water); }
  .link { stroke: var(--link); stroke-width: 4; stroke-linecap: round; }
  .actor { fill: var(--navy); stroke: #dfe7f7; stroke-width: 5; }
  .actor.alone { fill: var(--navy); stroke: var(--pink); stroke-width: 7; }
  .actor.ghost { fill: none; stroke: var(--navy); stroke-dasharray: 4 4; stroke-width: 3; opacity: .45; }
  .aid { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .aid.ghost-text { fill: var(--navy); opacity: .5; }
  .survivor { fill: var(--cut); } .saved { fill: var(--save); }
  .sid { fill: #fff; font-size: 10px; font-weight: 700; text-anchor: middle; }
  #devices { display: grid; gap: 8px; margin-bottom: 16px; }
  .card { display: flex; justify-content: space-between; gap: 8px; background: #fff; border: 2px solid var(--link); border-radius: 10px; padding: 8px 12px; }
  .card.down { background: var(--pink); border-color: var(--cut); }
  h2 { font-size: 1rem; margin: 16px 0 6px; }
  ul { list-style: none; padding: 0; margin: 0; font-size: .92rem; }
  li { padding: 3px 0; } li.stale { opacity: .55; } li.late { color: var(--cut); font-weight: 600; }
  .badge { font-size: .85rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #fff; border: 2px solid var(--link); }
  .badge.ok { border-color: var(--save); color: var(--save); } .badge.error { border-color: var(--cut); color: var(--cut); }
  #radio { margin-left: auto; font: inherit; font-weight: 700; padding: 6px 14px; border-radius: 999px; border: 0; background: var(--navy); color: #fff; cursor: pointer; }
  #radio[disabled] { opacity: .6; cursor: default; }
  .commander { margin: 0 0 6px; font-style: italic; }
</style>
</head>
<body>
  <header><h1>Blackout HQ</h1><span id="tick"></span><span id="mission"></span><span id="gemini" class="badge">Gemini idle</span><button id="radio">Turn on radio</button></header>
  <div class="layout">
    <svg id="map" role="img" aria-label="Map of actors, links and survivors"></svg>
    <section>
      <div id="devices"></div>
      <h2>What each actor is doing</h2>
      <ul id="reasons"></ul>
      <h2>Events</h2>
      <ul id="events"></ul>
      <h2>Standing orders (gemini-4-argon, written before the mission)</h2>
      <ul id="orders"></ul>
    </section>
  </div>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackout: Scout 4</title>
<style>
  :root { --navy: #0b1f5c; --link: #8fb0e8; --pink: #f4b6c2; --cut: #c4163c; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  body { background: var(--navy); color: white; display: grid; place-items: center; text-align: center; transition: background .3s; padding: 16px; box-sizing: border-box; }
  body.offline { background: var(--pink); color: var(--navy); }
  #start { font-size: 1.4rem; padding: 1.2rem 2.4rem; border: 0; border-radius: 999px; background: white; color: var(--navy); font-weight: 700; }
  .id { font-size: 4rem; font-weight: 800; }
  .state { font-size: 1.7rem; font-weight: 700; margin-top: .2rem; }
  .doing { font-size: 1.15rem; margin-top: 1rem; min-height: 1.4em; }
  .stats { margin-top: .6rem; font-variant-numeric: tabular-nums; }
  .meta { opacity: .65; margin-top: 1.4rem; font-size: .85rem; font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <button id="start">Tap to start Scout 4</button>
  <main id="ui" hidden>
    <div class="id">S4</div>
    <div class="state" id="state">connecting</div>
    <div class="doing" id="doing"></div>
    <div class="stats" id="stats"></div>
    <div class="meta" id="meta"></div>
  </main>
  <script type="module" src="/js/phone.js"></script>
</body>
</html>
